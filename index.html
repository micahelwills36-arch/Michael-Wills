<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var currentFetch = window.fetch;
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (!desc) {
            var proto = Object.getPrototypeOf(window);
            desc = proto ? Object.getOwnPropertyDescriptor(proto, 'fetch') : null;
          }
          if (desc && !desc.set && desc.configurable) {
            Object.defineProperty(window, 'fetch', {
              get: function () {
                return currentFetch;
              },
              set: function (newFn) {
                currentFetch = newFn;
              },
              configurable: true,
              enumerable: true,
            });
          }
        } catch (e) {}

        window.addEventListener(
          'error',
          function (e) {
            var msg = (e && (e.message || (e.error && e.error.message))) || '';
            if (typeof msg === 'string' && msg.indexOf('fetch') !== -1 && msg.indexOf('only a getter') !== -1) {
              e.preventDefault();
              if (e.stopImmediatePropagation) e.stopImmediatePropagation();
              return true;
            }
          },
          true
        );
      })();
    </script>
